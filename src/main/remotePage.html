<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#240407" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <title>Movie Night Remote</title>
    <style>
      :root {
        --bg: #1a0305;
        --card: #2d070c;
        --card-2: #3b0b12;
        --line: rgba(242, 184, 75, 0.25);
        --gold: #f2b84b;
        --gold-2: #ffe08a;
        --text: #fff4dc;
        --muted: #d6b8a0;
        --red: #d7263d;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: radial-gradient(circle at 50% 0%, #4a0a14 0%, var(--bg) 60%) fixed;
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        min-height: 100%;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      .logo svg {
        width: 44px;
        height: 44px;
        display: block;
      }
      .app-name {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 19px;
        color: var(--gold-2);
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }
      .dot {
        margin-left: auto;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #666;
        flex: none;
      }
      .dot.ok {
        background: #3ecf6b;
        box-shadow: 0 0 8px #3ecf6b;
      }
      .dot.bad {
        background: var(--red);
      }
      main {
        padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
        max-width: 520px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      .label {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .big-text {
        font-size: 22px;
        font-weight: 700;
      }
      .serif {
        font-family: Georgia, 'Times New Roman', serif;
        color: var(--gold-2);
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .clock {
        font-variant-numeric: tabular-nums;
        font-size: 34px;
        font-weight: 800;
        color: var(--gold-2);
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--card-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        min-height: 56px;
        padding: 10px 14px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button:active {
        transform: scale(0.98);
        filter: brightness(1.2);
      }
      button:disabled {
        opacity: 0.4;
      }
      button.primary {
        background: linear-gradient(180deg, var(--gold-2), var(--gold));
        color: #2b0508;
        border: none;
        min-height: 72px;
        font-size: 20px;
      }
      button.danger {
        background: transparent;
        color: #ff9aa6;
        border-color: rgba(215, 38, 61, 0.5);
      }
      button .hint {
        display: block;
        font-size: 13px;
        font-weight: 500;
        opacity: 0.75;
        margin-top: 2px;
      }
      .row {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 10px;
      }
      .vol {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: center;
      }
      .vol-value {
        min-width: 70px;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .progress {
        height: 8px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
        overflow: hidden;
        margin: 10px 0 6px;
      }
      .progress > div {
        height: 100%;
        background: var(--gold);
        width: 0;
      }
      .notice {
        background: rgba(242, 184, 75, 0.12);
        border: 1px solid var(--gold);
        border-radius: 12px;
        padding: 12px;
        font-size: 15px;
      }
      .login {
        text-align: center;
      }
      .login input {
        width: 100%;
        font-size: 36px;
        letter-spacing: 0.5em;
        text-align: center;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #120203;
        color: var(--gold-2);
        margin: 12px 0;
      }
      .error {
        color: #ff9aa6;
        min-height: 20px;
        font-size: 14px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: #000c;
        color: #fff;
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo"><!--LOGO--></div>
      <div>
        <div class="app-name">Movie Night Remote</div>
        <div class="sub" id="sub">Connecting…</div>
      </div>
      <span class="dot" id="dot"></span>
    </header>
    <main id="app"></main>
    <div id="toast"></div>
    <script>
      ;(function () {
        const app = document.getElementById('app')
        const sub = document.getElementById('sub')
        const dot = document.getElementById('dot')
        const toastEl = document.getElementById('toast')
        let token = null
        try {
          token = localStorage.getItem('mni-remote-token')
        } catch (e) {}
        let state = null
        let skew = 0
        let viewKey = ''
        let loggedOut = false
        let failures = 0

        const esc = (s) =>
          String(s).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
          )
        const pcNow = () => Date.now() + skew
        function clock(sec) {
          sec = Math.max(0, Math.floor(sec))
          const h = Math.floor(sec / 3600)
          const m = Math.floor((sec % 3600) / 60)
          const s = String(sec % 60).padStart(2, '0')
          return h > 0 ? h + ':' + String(m).padStart(2, '0') + ':' + s : m + ':' + s
        }
        function toast(msg) {
          toastEl.textContent = msg
          toastEl.classList.add('show')
          clearTimeout(toast.t)
          toast.t = setTimeout(() => toastEl.classList.remove('show'), 1800)
        }

        function btn(cmd, text, opts) {
          opts = opts || {}
          return (
            '<button class="' +
            (opts.cls || '') +
            '" data-cmd="' +
            cmd +
            '"' +
            (opts.value !== undefined ? ' data-value="' + opts.value + '"' : '') +
            (opts.confirm ? ' data-confirm="' + esc(opts.confirm) + '"' : '') +
            (opts.disabled ? ' disabled' : '') +
            '>' +
            text +
            (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') +
            '</button>'
          )
        }
        const volumeRow = () =>
          '<div class="card"><div class="label">Volume</div><div class="vol">' +
          btn('volume', '−', { value: -0.1 }) +
          '<div class="vol-value" data-bind="volume"></div>' +
          btn('volume', '+', { value: 0.1 }) +
          '</div></div>'
        const exitBtn = () =>
          btn('exitShow', 'Exit the show', {
            cls: 'danger',
            confirm: 'Exit the show and go back to the editor?'
          })

        function view(s) {
          switch (s.phase) {
            case 'home':
              return '<div class="card"><div class="big-text">No project open</div><p class="muted">Open a project on the PC to get started.</p></div>'
            case 'editor':
              return (
                '<div class="card"><div class="label">Ready</div><div class="big-text serif">' +
                esc(s.projectName) +
                '</div>' +
                (s.movieTitle ? '<p class="muted">Feature: ' + esc(s.movieTitle) + '</p>' : '') +
                '</div>' +
                btn('startShow', '▶ Start the pre-show', {
                  cls: 'primary',
                  disabled: !s.canStart,
                  hint: s.canStart
                    ? 'Goes fullscreen on the PC'
                    : 'Add something to the playlist first'
                }) +
                (s.resumeAtSec
                  ? btn('resumeMovie', '⏯ Resume the movie at ' + clock(s.resumeAtSec), {
                      hint: 'Pick up where it stopped'
                    })
                  : '')
              )
            case 'preshow':
              return (
                '<div class="card"><div class="label">Now playing <span data-bind="position"></span></div>' +
                '<div class="big-text" data-bind="item"></div>' +
                (s.showtimeAt
                  ? '<div class="label" style="margin-top:14px">Showtime</div><div class="clock" data-bind="showtime"></div>'
                  : '') +
                '</div>' +
                (s.hasFeature
                  ? s.wrappingUp
                    ? '<div class="notice">Wrapping up: the hold screen comes up when this item ends.</div>' +
                      '<div class="row">' +
                      btn('cancelWrapUp', 'Keep going') +
                      btn('startMovie', 'Start movie now', {
                        confirm: 'Cut the pre-show and start the movie now?'
                      }) +
                      '</div>'
                    : btn('wrapUp', '🎬 Wrap up & start the movie', {
                        cls: 'primary',
                        hint: "Finishes what's playing, then the hold screen"
                      })
                  : '') +
                '<div class="card"><div class="label">Pre-show</div><div class="row">' +
                btn('prev', '⏮') +
                btn('togglePause', '<span data-bind="pauseIcon"></span>') +
                btn('next', '⏭') +
                '</div></div>' +
                volumeRow() +
                (s.showtimeAt
                  ? '<div class="card"><div class="label">Countdown</div><div class="row">' +
                    btn('shiftShowtime', '−5 min', { value: -5 }) +
                    btn('shiftShowtime', '+5 min', { value: 5 }) +
                    '</div>' +
                    '<div class="label" style="margin-top:12px">Start in</div><div class="row">' +
                    btn('startIn', '2 min', { value: 2 }) +
                    btn('startIn', '5 min', { value: 5 }) +
                    btn('startIn', '10 min', { value: 10 }) +
                    '</div></div>'
                  : '') +
                exitBtn()
              )
            case 'hold':
              return (
                '<div class="card"><div class="label">Hold screen is up</div><div class="big-text serif">' +
                esc(s.movieTitle || 'The feature') +
                '</div>' +
                (s.rollAt
                  ? '<div class="label" style="margin-top:14px">Movie rolls in</div><div class="clock" data-bind="roll"></div>'
                  : '<p class="muted">Waiting for you to start the movie.</p>') +
                '</div>' +
                btn('startMovie', s.rollAt ? '▶ Start it now' : '▶ Start the movie', {
                  cls: 'primary'
                }) +
                (s.rollAt
                  ? '<div class="card"><div class="label">Need more time?</div><div class="row">' +
                    btn('startIn', '+2 min', { value: 2 }) +
                    btn('startIn', '+5 min', { value: 5 }) +
                    '</div></div>'
                  : '') +
                volumeRow() +
                exitBtn()
              )
            case 'intro':
              return (
                '<div class="card"><div class="big-text serif">🎬 The feature is starting…</div></div>' +
                volumeRow()
              )
            case 'movie':
              return (
                '<div class="card"><div class="label">Now showing</div><div class="big-text serif">' +
                esc(s.movieTitle || 'The feature') +
                '</div>' +
                '<div class="progress"><div data-bind="progress"></div></div><div class="muted" data-bind="time"></div></div>' +
                btn('togglePause', '<span data-bind="pauseLabel"></span>', { cls: 'primary' }) +
                '<div class="row">' +
                btn('seek', '⟲ 10s', { value: -10 }) +
                btn('seek', '10s ⟳', { value: 10 }) +
                '</div>' +
                volumeRow() +
                (s.movie && s.movie.hasSubtitles
                  ? btn('toggleSubtitles', '<span data-bind="subs"></span>')
                  : '') +
                btn('showEndCard', 'End the movie → thanks card', {
                  confirm: 'Stop the movie and show the thanks card?'
                }) +
                exitBtn()
              )
            case 'handoff':
              return (
                '<div class="card"><div class="label">Now showing</div><div class="big-text serif">' +
                esc(s.movieTitle || 'The feature') +
                '</div>' +
                '<p class="muted">Playing in ' +
                (s.handoffTo === 'browser' ? 'the web browser' : 'the video player') +
                ' on the PC. Use its own controls to pause or change the volume.</p></div>' +
                btn('showEndCard', 'Show the thanks card', {
                  cls: 'primary',
                  hint: 'When the movie is over'
                }) +
                exitBtn()
              )
            case 'ended':
              return (
                '<div class="card"><div class="big-text serif">Thanks card is showing</div><p class="muted">The show is over.</p></div>' +
                exitBtn()
              )
          }
          return ''
        }

        function bind(name, fn) {
          app.querySelectorAll('[data-bind="' + name + '"]').forEach(fn)
        }
        function update() {
          const s = state
          if (!s) return
          bind('volume', (el) => (el.textContent = Math.round(s.volume * 100) + '%'))
          bind('item', (el) => (el.textContent = s.itemTitle))
          bind(
            'position',
            (el) =>
              (el.textContent = s.itemCount ? '· ' + (s.itemIndex + 1) + ' of ' + s.itemCount : '')
          )
          bind('pauseIcon', (el) => (el.textContent = s.paused ? '▶' : '⏸'))
          bind(
            'pauseLabel',
            (el) => (el.textContent = s.movie && s.movie.paused ? '▶ Play' : '⏸ Pause')
          )
          bind('showtime', (el) => {
            const left = (s.showtimeAt - pcNow()) / 1000
            el.textContent =
              left > 0 ? clock(left) : s.hasFeature ? 'Now: movie after this item' : 'Now'
          })
          bind(
            'roll',
            (el) => (el.textContent = s.paused ? 'Paused' : clock((s.rollAt - pcNow()) / 1000))
          )
          if (s.movie) {
            const m = s.movie
            bind(
              'progress',
              (el) =>
                (el.style.width = (m.durationSec ? (100 * m.positionSec) / m.durationSec : 0) + '%')
            )
            bind(
              'time',
              (el) => (el.textContent = clock(m.positionSec) + ' / ' + clock(m.durationSec))
            )
            bind(
              'subs',
              (el) => (el.textContent = m.subtitlesOn ? 'Subtitles: on' : 'Subtitles: off')
            )
          }
        }

        function render() {
          const s = state
          const key = [
            s.phase,
            s.wrappingUp,
            s.hasFeature,
            s.canStart,
            !!s.resumeAtSec,
            !!s.showtimeAt,
            !!s.rollAt,
            s.handoffTo,
            !!(s.movie && s.movie.hasSubtitles),
            s.projectName,
            s.movieTitle
          ].join('|')
          if (key !== viewKey) {
            viewKey = key
            app.innerHTML = view(s)
          }
          sub.textContent = s.projectName || 'Movie Night Intro'
          update()
        }

        function showLogin(message) {
          loggedOut = true
          viewKey = ''
          app.innerHTML =
            '<div class="card login"><div class="big-text serif">Enter the PIN</div>' +
            '<p class="muted">It\'s shown in the app on the PC under 📱 Remote.</p>' +
            '<input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" />' +
            '<div class="error" id="err">' +
            esc(message || '') +
            '</div>' +
            '<button class="primary" id="go">Connect</button></div>'
          const input = document.getElementById('pin')
          const go = document.getElementById('go')
          const submit = async () => {
            go.disabled = true
            try {
              const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: input.value })
              })
              const body = await res.json()
              if (!res.ok) throw new Error(body.error || 'Could not connect.')
              token = body.token
              try {
                localStorage.setItem('mni-remote-token', token)
              } catch (e) {}
              loggedOut = false
              poll()
            } catch (e) {
              document.getElementById('err').textContent = e.message
              go.disabled = false
            }
          }
          go.onclick = submit
          input.onkeydown = (e) => e.key === 'Enter' && submit()
          input.focus()
        }

        async function poll() {
          if (loggedOut) return
          try {
            const res = await fetch('/api/state', {
              headers: { 'X-Remote-Token': token || '' },
              cache: 'no-store'
            })
            if (res.status === 401) {
              dot.className = 'dot'
              showLogin()
              return
            }
            const body = await res.json()
            skew = body.serverNow - Date.now()
            state = body.state
            failures = 0
            dot.className = 'dot ok'
            render()
          } catch (e) {
            failures++
            if (failures >= 2) {
              dot.className = 'dot bad'
              sub.textContent = "Can't reach the PC. Same Wi-Fi?"
            }
          }
        }

        app.addEventListener('click', async (e) => {
          const b = e.target.closest('button[data-cmd]')
          if (!b || b.disabled) return
          if (b.dataset.confirm && !confirm(b.dataset.confirm)) return
          const command = { cmd: b.dataset.cmd }
          if (b.dataset.value !== undefined) command.value = Number(b.dataset.value)
          try {
            const res = await fetch('/api/command', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Remote-Token': token || '' },
              body: JSON.stringify(command)
            })
            if (res.status === 401) return showLogin()
            if (!res.ok) throw new Error((await res.json()).error)
            if (navigator.vibrate) navigator.vibrate(15)
          } catch (err) {
            toast(err.message || "Couldn't send that.")
          }
          setTimeout(poll, 250)
        })

        setInterval(poll, 1000)
        setInterval(update, 250)
        document.addEventListener('visibilitychange', () => !document.hidden && poll())
        if (token) poll()
        else showLogin()
      })()
    </script>
  </body>
</html>

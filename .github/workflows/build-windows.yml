name: Build Windows installer

on:
  push:
    branches:
      - claude/windows-playlist-player-app-8qdrng
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the installer to a GitHub Release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Set both to also publish to itch.io (see RELEASING.md); without them that step is skipped.
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }} # e.g. yourname/movie-night-intro
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true' }}
      # Code signing with Azure Artifact Signing (see RELEASING.md). Releases are signed once
      # the AZURE_CLIENT_SECRET secret exists; everyday builds stay unsigned.
      SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build Windows installer
        if: env.PUBLISHING != 'true' || env.SIGNING != 'true'
        run: npm run build:win

      - name: Build signed Windows installer
        if: env.PUBLISHING == 'true' && env.SIGNING == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'SIGN_ENDPOINT', 'SIGN_ACCOUNT', 'SIGN_PROFILE', 'SIGN_PUBLISHER') {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              Write-Output "::error::Code signing is half set up: $name is missing (see RELEASING.md)"
              exit 1
            }
          }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --publish never `
            "-c.win.azureSignOptions.endpoint=$env:SIGN_ENDPOINT" `
            "-c.win.azureSignOptions.codeSigningAccountName=$env:SIGN_ACCOUNT" `
            "-c.win.azureSignOptions.certificateProfileName=$env:SIGN_PROFILE" `
            "-c.win.azureSignOptions.publisherName=$env:SIGN_PUBLISHER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check signatures
        if: env.PUBLISHING == 'true' && env.SIGNING == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/*-setup.exe) + @(Get-Item dist/win-unpacked/movie-night-intro.exe)
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { Write-Output '::error::Not every file is validly signed'; exit 1 }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-night-intro-windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Determine release tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: dist/*.exe
          generate_release_notes: true

      # The itch app installs and updates the unpacked app folder (with .itch.toml telling it
      # what to launch); browser downloads also get the regular installer.
      - name: Upload to itch.io
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true') && env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          # Accept "user/game" or "user/game:channel"; the channels are set here.
          $target = $env:ITCH_TARGET.Split(':')[0]
          Invoke-WebRequest https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler
          Copy-Item build/itch/.itch.toml dist/win-unpacked/.itch.toml
          ./butler/butler.exe push dist/win-unpacked "$($target):windows" --userversion $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./butler/butler.exe push "dist/movie-night-intro-$version-setup.exe" "$($target):windows-installer" --userversion $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Note skipped itch.io upload
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true') && (env.BUTLER_API_KEY == '' || env.ITCH_TARGET == '')
        shell: bash
        run: echo "::notice::itch.io upload skipped; set the BUTLER_API_KEY secret and ITCH_TARGET variable to enable it (see RELEASING.md)."
